name: Deploy frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Engagement guard
        working-directory: ${{ github.workspace }}
        run: python3 scripts/engagement_guard.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # deductions.lailarallc.com is served by the Pages project
        # retailer-deduction-recovery (per CLAUDE.md "Deployment: Cloudflare Pages").
        # The prior `wrangler deploy` shipped a Worker nothing routed to — the live
        # site sat ~2 months stale. Deploy the built dist to the Pages project instead.
        run: npx wrangler pages deploy dist --project-name retailer-deduction-recovery --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
